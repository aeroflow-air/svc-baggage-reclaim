# Backstage catalogue entry for this repo (ADR-0024, platform-handbook#123).
# Discovered by the aeroflow-air Backstage instance (aeroflow-air/backstage).
# Domains, Systems and the event-bus Resource live in platform-handbook/catalog/.
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: svc-baggage-reclaim
  title: Baggage reclaim
  description: >-
    Assigns reclaim belts to arrivals at LHR, simulates unloading and
    publishes baggage-events. HTTP API for belts, reclaims and bags (OpenAPI spec checked in under openapi/). Not deployed.
  annotations:
    github.com/project-slug: aeroflow-air/svc-baggage-reclaim
    backstage.io/techdocs-ref: dir:.
  tags:
    - dotnet
    - service-bus
spec:
  type: service
  lifecycle: experimental
  owner: group:squad-checkin
  system: airport
  providesApis:
    - svc-baggage-reclaim-api
    - baggage-events
  consumesApis:
    - flight-events
  dependsOn:
    - resource:event-bus
    - component:lib-service-defaults
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: baggage-events
  title: baggage-events topic
  description: >-
    Event contract for the baggage-events topic, owned by svc-baggage-reclaim
    (ADR-0019): BeltAssigned, BagsOnBelt, BagDelayed, LastBagOnBelt,
    ReclaimComplete. Canonical examples in contracts/baggage-events/.
  annotations:
    github.com/project-slug: aeroflow-air/svc-baggage-reclaim
  links:
    - url: https://github.com/aeroflow-air/svc-baggage-reclaim/tree/main/contracts/baggage-events
      title: Contract examples
spec:
  type: event-contract
  lifecycle: experimental
  owner: group:squad-checkin
  system: airport
  definition:
    $text: ./contracts/README.md
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: svc-baggage-reclaim-api
  title: Baggage reclaim HTTP API
  description: >-
    Belts, reclaims and single bags; completing a reclaim needs the Ops.Reclaim.Write role (ADR-0018). Generated OpenAPI 3 document (openapi/svc-baggage-reclaim.json).
    Exported from the running code and kept in step by a test; the service
    only serves the live document in Development (ADR-0015).
  annotations:
    github.com/project-slug: aeroflow-air/svc-baggage-reclaim
spec:
  type: openapi
  lifecycle: experimental
  owner: group:squad-checkin
  system: airport
  definition:
    $text: ./openapi/svc-baggage-reclaim.json
