# Agent skills (ADR-0023). Thin caller: real work lives in aeroflow-workflows.
# Pin a release tag, never @main.
#
# check: on PRs, fail if .claude/skills/aeroflow-* drifts from .agent-skills.yaml.
# bump: weekly or by hand, open/update one PR to the latest agent-skills release.
# PRs opened with GITHUB_TOKEN don't trigger CI; close and reopen the bump PR to
# run checks (or pass app-id / app-private-key, see the aeroflow-workflows README).

name: Agent skills

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'pull_request'
    uses: aeroflow-air/aeroflow-workflows/.github/workflows/sync-agent-skills.yml@v0.7.0
    with:
      mode: check
      workflows_ref: v0.7.0   # keep in sync with the uses: pin above
    permissions:
      contents: read

  bump:
    if: github.event_name != 'pull_request'
    uses: aeroflow-air/aeroflow-workflows/.github/workflows/sync-agent-skills.yml@v0.7.0
    with:
      mode: bump
      workflows_ref: v0.7.0   # keep in sync with the uses: pin above
    permissions:
      contents: write
      pull-requests: write
